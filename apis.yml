aid: board
name: Board
description: >-
  Board (board.fun) is a maker of turn-based strategy board games sold direct-to-consumer
  through a Shopify storefront - its debut title, Thrasos, is a game in which players compete
  as Greek gods for control of ancient Greece by blessing and cursing cities to build influence.
  Board was surfaced as a portfolio company of Union Square Ventures and added to the API
  Evangelist network. Although Board ships no bespoke developer API, its store exposes a full,
  live agent-commerce surface via Shopify's Universal Commerce Protocol (UCP): a hosted MCP
  endpoint, OpenID Connect customer accounts, published /llms.txt and /agents.md agent
  instructions, and Shop Pay / card payment handlers - enabling AI shopping agents to discover,
  cart, and (with human approval) purchase products.
