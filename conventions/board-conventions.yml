generated: '2026-07-18'
method: searched
source: https://board.fun/llms.txt, https://board.fun/agents.md, https://board.fun/.well-known/ucp
notes: >-
  Cross-cutting semantics for Board's agent-commerce surface, captured verbatim
  from the store's published agent instructions and UCP profile. No idempotency
  contract is documented, so none is asserted here.
authentication:
  style: OpenID Connect (Shopify Customer Accounts) for transactional flows; read-only browsing is unauthenticated.
  see: authentication/board-authentication.yml
versioning:
  scheme: dated UCP protocol versions
  current: '2026-04-08'
  supported:
  - '2026-04-08'
  - '2026-01-23'
rate_limiting:
  signal: The UCP/MCP endpoint is rate-limited per IP. Agents must back off on HTTP 429 responses.
buyer_approval:
  rule: Checkout must not be completed without explicit, contemporaneous buyer approval of payment.
request_context:
  fields:
  - context.address_country
  - context.currency
  note: Pass buyer context for accurate pricing and availability.
read_only_browsing:
  endpoints:
  - GET /collections/all
  - GET /products/{handle}.json
  - GET /collections/{handle}/products.json
  - GET /search?q={query}&type=product
  - GET /sitemap.xml
payment_handlers:
- dev.shopify.shop_pay
- dev.shopify.card
- google_pay
