generated: '2026-07-18'
method: searched
status: published
source: https://board.fun/.well-known/ucp
notes: >-
  Board exposes a live agent-commerce MCP server via Shopify's Universal Commerce
  Protocol (UCP). The MCP endpoint is advertised in /.well-known/ucp and in
  /llms.txt. Discovery requires a UCP agent profile URI; checkout requires
  contemporaneous human buyer approval. This is a Shopify-platform-provided
  surface bound to the board.fun store, not a bespoke first-party server.
server:
  name: board-ucp-shopping
  protocol: Universal Commerce Protocol (UCP)
  ucp_version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  transport: mcp
  url: https://board.fun/api/ucp/mcp
  canonical_url: https://board-console.myshopify.com/api/ucp/mcp
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  auth: OIDC (Shopify Customer Accounts) for authenticated flows; read-only browsing unauthenticated
tools:
- name: search_catalog
  description: Search the store catalog for products matching a buyer's intent.
  source: llms.txt UCP typical agent flow (step 2)
- name: create_cart
  description: Create a cart and add desired items.
  source: llms.txt UCP typical agent flow (step 3)
- name: create_checkout
  description: Start the purchase flow for a cart.
  source: llms.txt UCP typical agent flow (step 4)
- name: update_checkout
  description: Set shipping address and shipping method on a checkout.
  source: llms.txt UCP typical agent flow (step 5)
- name: complete_checkout
  description: Finalize the purchase. Buyer must explicitly approve payment.
  source: llms.txt UCP typical agent flow (step 6)
rules:
- Checkout requires human approval; agents must not complete payment without explicit buyer consent.
- The MCP endpoint is rate-limited per IP; back off on 429 responses.
- Pass context.address_country and context.currency for accurate pricing and availability.
